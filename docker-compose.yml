version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: ./.env # <-- local .env (will be ignored by git)
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "80:80"
    restart: unless-stopped
